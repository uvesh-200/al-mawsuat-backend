name: al-mawsuat-backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mawsuat_network
    expose:
      - "5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    depends_on:
      - postgres
    networks:
      - mawsuat_network
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - mawsuat_network
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mawsuat_network
    ports:
      - "6333:6333"

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - meili_data:/meili_data
    networks:
      - mawsuat_network
    ports:
      - "7700:7700"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - mawsuat_network
    ports:
      - "9000:9000"
      - "9001:9001"

  embedding_server:
    build:
      context: ./inference
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - hf_cache_embedding:/root/.cache/huggingface
    networks:
      - mawsuat_network
    expose:
      - "8001"

  translation_server:
    build:
      context: ./inference
      dockerfile: Dockerfile.translation
    restart: unless-stopped
    networks:
      - mawsuat_network
    volumes:
      - hf_cache_translation:/root/.cache/huggingface
    expose:
      - "8002"
    ports:
      - "8002:8002"

  llm_server:
    build:
      context: ./inference
      dockerfile: Dockerfile.llm
    restart: unless-stopped
    volumes:
      - hf_cache_llm:/root/.cache/huggingface
    networks:
      - mawsuat_network
    expose:
      - "8003"
    ports:
      - "8003:8003"

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host-only .env URLs so the app and one-off commands (e.g. alembic) reach services on the compose network.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      EMBEDDING_SERVER_URL: http://embedding_server:8001
      NLLB_SERVER_URL: http://translation_server:8002
      VLLM_BASE_URL: http://llm_server:8003/v1
      QDRANT_HOST: qdrant
      MEILISEARCH_URL: http://meilisearch:7700
    depends_on:
      - postgres
      - pgbouncer
      - redis
      - qdrant
      - meilisearch
      - minio
      - embedding_server
      - translation_server
      - llm_server
    networks:
      - mawsuat_network
    expose:
      - "8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      EMBEDDING_SERVER_URL: http://embedding_server:8001
      NLLB_SERVER_URL: http://translation_server:8002
      VLLM_BASE_URL: http://llm_server:8003/v1
      QDRANT_HOST: qdrant
      MEILISEARCH_URL: http://meilisearch:7700
    depends_on:
      - postgres
      - pgbouncer
      - redis
      - qdrant
      - meilisearch
      - minio
      - embedding_server
      - translation_server
      - llm_server
    networks:
      - mawsuat_network

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      EMBEDDING_SERVER_URL: http://embedding_server:8001
      NLLB_SERVER_URL: http://translation_server:8002
      VLLM_BASE_URL: http://llm_server:8003/v1
      QDRANT_HOST: qdrant
      MEILISEARCH_URL: http://meilisearch:7700
    command: ["celery", "-A", "workers.celery_worker", "beat", "--loglevel=info"]
    depends_on:
      - postgres
      - pgbouncer
      - redis
    networks:
      - mawsuat_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - fastapi
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mawsuat_network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  meili_data:
  minio_data:
  hf_cache_embedding:
  hf_cache_translation:
  hf_cache_llm:

networks:
  mawsuat_network:
    driver: bridge

