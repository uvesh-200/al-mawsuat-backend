limit_req_zone $binary_remote_addr zone=ask:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 200M;

    location = /ask {
        limit_req zone=ask burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 200M;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location = /ask/stream {
        limit_req zone=ask burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_buffering off;
    }

    location = /auth/login {
        limit_req zone=login burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location = /admin/books/upload {
        limit_req zone=upload burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 200M;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location / {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 200M;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    error_page 429 @rate_limit;
    location @rate_limit {
        default_type application/json;
        return 429 '{"detail": "Rate limit exceeded"}';
    }
}
